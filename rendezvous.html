<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#e8d6c3"
    >

    <title>Notre rendez-vous est confirmé</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <article class="card confirmation-card">
            <div class="confirmation-icon" aria-hidden="true">
                ✓
            </div>

            <p class="page-label">
                Invitation acceptée
            </p>

            <h1 class="confirmation-title">
                Notre rendez-vous est confirmé
            </h1>

            <div class="ornament" aria-hidden="true">
                ♥
            </div>

            <section
                class="summary"
                id="summary"
                aria-label="Récapitulatif du rendez-vous"
            >
                <div class="summary-item">
                    <span class="summary-label">
                        Date
                    </span>

                    <span
                        class="summary-value"
                        id="selected-date"
                    >
                        Chargement…
                    </span>
                </div>

                <div class="summary-item">
                    <span class="summary-label">
                        Plan de la soirée
                    </span>

                    <span
                        class="summary-value"
                        id="selected-activity"
                    >
                        Chargement…
                    </span>
                </div>

                <div class="summary-item">
                    <span class="summary-label">
                        Suppléments
                    </span>

                    <div
                        class="summary-value"
                        id="selected-supplements"
                    >
                        Chargement…
                    </div>
                </div>
            </section>

            <p class="final-message">
                Je m'occupe de tout.<br>
                À très vite, ma canaille&nbsp;! 🤍
            </p>

            <div class="bottom-images" aria-label="Nos souvenirs">
                <img
                    src="images/Image15.jpg"
                    class="bottom-image"
                    alt="Photo souvenir"
                >
            
                <img
                    src="images/Image18.jpg"
                    class="bottom-image"
                    alt="Photo souvenir"
                >
            </div>

            <button
                type="button"
                class="close-button"
                id="close-button"
            >
                Refermer la lettre
            </button>

            <p
                class="status-message"
                id="status-message"
                aria-live="polite"
            ></p>
        </article>
    </main>

    <script>
        const dateValue = localStorage.getItem("date");
        const activityValue = localStorage.getItem("activite");

        let supplements = [];

        try {
            supplements = JSON.parse(
                localStorage.getItem("supplements") || "[]"
            );

            if (!Array.isArray(supplements)) {
                supplements = [];
            }
        } catch (error) {
            supplements = [];
        }

        /*
         * Compatibilité avec les anciennes sauvegardes
         * séparées de balade et chauffeur.
         */
        if (
            supplements.length === 0 &&
            localStorage.getItem("balade") === "true"
        ) {
            supplements.push("Balade accompagnée");
        }

        if (
            !supplements.includes("Chauffeur privé") &&
            localStorage.getItem("chauffeur") === "true"
        ) {
            supplements.push("Chauffeur privé");
        }

        const dateElement =
            document.getElementById("selected-date");

        const activityElement =
            document.getElementById("selected-activity");

        const supplementsElement =
            document.getElementById("selected-supplements");

        const closeButton =
            document.getElementById("close-button");

        const statusMessage =
            document.getElementById("status-message");

        const page =
            document.querySelector(".page");

        function formatFrenchDate(dateString) {
            if (!dateString) {
                return "Date non définie";
            }

            /*
             * Le T12:00 évite qu’un changement de fuseau horaire
             * décale la date au jour précédent.
             */
            const date = new Date(`${dateString}T12:00:00`);

            if (Number.isNaN(date.getTime())) {
                return dateString;
            }

            return new Intl.DateTimeFormat(
                "fr-FR",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            ).format(date);
        }

        function displaySummary() {
            dateElement.textContent =
                formatFrenchDate(dateValue);

            activityElement.textContent =
                activityValue || "Formule non définie";

            supplementsElement.replaceChildren();

            if (supplements.length === 0) {
                supplementsElement.textContent =
                    "Aucun supplément sélectionné";

                return;
            }

            const list = document.createElement("ul");
            list.className = "supplement-list";

            supplements.forEach(function (supplement) {
                const item = document.createElement("li");
                item.textContent = supplement;
                list.appendChild(item);
            });

            supplementsElement.appendChild(list);
        }

        async function sendResult() {
            if (!dateValue || !activityValue) {
                statusMessage.textContent =
                    "Certaines informations du rendez-vous sont manquantes.";

                statusMessage.classList.add("error");
                return;
            }

            /*
             * Cette clé empêche un deuxième envoi lorsque
             * la page est simplement actualisée.
             */
            const submissionIdentifier = [
                dateValue,
                activityValue,
                supplements.join("|")
            ].join("__");

            const lastSubmission =
                sessionStorage.getItem("lastSubmission");

            if (lastSubmission === submissionIdentifier) {
                return;
            }

            statusMessage.textContent =
                "Confirmation en cours d’envoi…";

            try {
                const response = await fetch(
                    "https://formspree.io/f/xkoldvab",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },

                        body: JSON.stringify({
                            "Date choisie":
                                formatFrenchDate(dateValue),

                            "Formule choisie":
                                activityValue,

                            "Suppléments":
                                supplements.length > 0
                                    ? supplements.join(", ")
                                    : "Aucun supplément"
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        `Erreur HTTP ${response.status}`
                    );
                }

                sessionStorage.setItem(
                    "lastSubmission",
                    submissionIdentifier
                );

                statusMessage.textContent =
                    "Votre réponse a bien été enregistrée 🤍";
            } catch (error) {
                console.error(
                    "Erreur lors de l’envoi :",
                    error
                );

                statusMessage.textContent =
                    "Le rendez-vous est enregistré sur cet appareil, mais l’envoi de la confirmation a échoué.";

                statusMessage.classList.add("error");
            }
        }

        closeButton.addEventListener("click", function () {
            page.classList.add("page-exit");

            window.setTimeout(function () {
                window.location.href =
                    "https://www.instagram.com/_rauger_/";
            }, 330);
        });

        displaySummary();
        sendResult();
    </script>
</body>
</html>
