<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plan de la soirée ❤️</title>

<style>

body{
    margin:0;
    background:#e8d6c3;
    font-family:Georgia, serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:420px;
    max-width:100%;
    background:#f5e6d6;
    padding:25px;
    border-radius:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

h2{
    text-align:center;
    color:#5d4635;
    margin-bottom:15px;
}

.date-box{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:25px;
}

input[type="date"]{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:2px solid #d8c0a8;
    font-size:16px;
    box-sizing:border-box;
}

.section-title{
    text-align:center;
    color:#5d4635;
    font-size:32px;
    font-style:italic;
    margin:25px 0;
    font-family:'Palatino Linotype', serif;
}

.grid{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.activity{
    position:relative;
}

.activity input{
    display:none;
}

.activity label{
    display:block;
    background:linear-gradient(135deg,#fffdfb,#fff7ef);
    border:2px solid #e4d3c2;
    border-radius:20px;
    padding:22px;
    cursor:pointer;
    position:relative;
    overflow:hidden;

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;

    will-change:transform;

    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.activity label:hover{
    transform:translateY(-3px);
}

.activity label:active{
    transform:scale(.98);
}

.activity input:checked + label{
    border-color:#b8945e;
    background:#fffaf4;

    transform:translateY(-2px);

    box-shadow:
        0 4px 12px rgba(184,148,94,.18),
        0 0 0 3px rgba(184,148,94,.12);
}

.activity input:checked + label::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:5px;
    background:#b8945e;

    animation:slideBar .25s ease-out;
}

.activity input:checked + label::after{
    content:"♥";

    position:absolute;
    top:12px;
    right:12px;

    width:30px;
    height:30px;

    border-radius:50%;
    background:#b8945e;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    animation:heartPop .25s ease-out;
}

.formule-titre{
    display:block;
    text-align:center;
    color:#5d4635;

    font-family:
        "Palatino Linotype",
        "Book Antiqua",
        serif;

    font-size:28px;
    font-style:italic;

    margin-bottom:10px;
}

.formule-separateur{
    width:60px;
    height:2px;
    background:#b8945e;
    margin:0 auto 15px auto;
}

.formule-description{
    display:block;
    text-align:center;
    color:#7a624f;
    line-height:1.7;
    font-size:14px;
}

/* SUPPLÉMENTS */

.supplement{
    margin-top:10px;
}

.supplement label{
    min-height:auto;
}

button{
    margin-top:30px;
    width:100%;
    padding:16px;
    border:none;
    background:#7b9a6b;
    color:white;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#6a895c;
}

.result{
    display:none;
}

#overlay{
    position:fixed;
    inset:0;
    background:rgba(93,70,53,.95);
    color:white;
    font-size:24px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:9999;
