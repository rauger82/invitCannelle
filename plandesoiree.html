<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#e8d6c3">

    <title>Plan de la soirée ❤️</title>

    <style>
        :root {
            --fond-page: #e8d6c3;
            --fond-carte: #f5e6d6;
            --fond-formule-selectionnee: #fff8ee;

            --texte-principal: #5d4635;
            --texte-secondaire: #7a624f;

            --dore: #b8945e;
            --dore-clair: #e4d3c2;

            --vert: #7b9a6b;
            --vert-fonce: #68865a;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--fond-page);
        }

        body {
            margin: 0;

            min-height: 100vh;
            min-height: 100dvh;

            padding:
                max(20px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));

            display: flex;
            justify-content: center;
            align-items: flex-start;

            color: var(--texte-principal);

            background:
                radial-gradient(
                    circle at top,
                    rgba(255, 255, 255, 0.3),
                    transparent 38%
                ),
                var(--fond-page);

            font-family: Georgia, "Times New Roman", serif;
        }

        .container {
            width: 100%;
            max-width: 460px;

            margin: auto 0;
            padding: 26px 22px;

            background: var(--fond-carte);

            border: 1px solid rgba(93, 70, 53, 0.08);
            border-radius: 26px;

            box-shadow:
                0 18px 45px rgba(93, 70, 53, 0.15),
                0 3px 10px rgba(93, 70, 53, 0.08);

            opacity: 0;
            transform: translateY(14px);

            animation: apparitionPage 650ms ease forwards;
        }

        h1,
        h2,
        p {
            margin-top: 0;
        }

        /* ----------------------------- */
        /* CHOIX DE LA DATE              */
        /* ----------------------------- */

        .date-title {
            margin-bottom: 15px;

            color: var(--texte-principal);
            text-align: center;

            font-size: 22px;
        }

        .date-box {
            padding: 15px;
            margin-bottom: 28px;

            background: rgba(255, 255, 255, 0.88);

            border: 1px solid rgba(184, 148, 94, 0.25);
            border-radius: 16px;
        }

        input[type="date"] {
            width: 100%;
            min-height: 48px;

            padding: 11px 12px;

            color: var(--texte-principal);
            background: #fffdfb;

            border: 2px solid #d8c0a8;
            border-radius: 11px;

            font-family: Georgia, "Times New Roman", serif;
            font-size: 16px;
        }

        input[type="date"]:focus {
            outline: 3px solid rgba(184, 148, 94, 0.2);
            border-color: var(--dore);
        }

        /* ----------------------------- */
        /* TITRE ET PHOTO                */
        /* ----------------------------- */

        .section-title {
            margin: 0 0 16px;

            color: var(--texte-principal);
            text-align: center;

            font-family:
                "Palatino Linotype",
                Palatino,
                "Book Antiqua",
                Georgia,
                serif;

            font-size: clamp(28px, 8vw, 36px);
            font-weight: normal;
            font-style: italic;
            letter-spacing: 0.4px;
        }

        .photo-wrapper {
            display: flex;
            justify-content: center;

            width: 100%;
            margin: 0 auto 20px;
        }

        .hero-photo {
            display: block;

            width: min(76%, 270px);
            height: 175px;

            object-fit: cover;
            object-position: center 42%;

            border: 4px solid rgba(255, 255, 255, 0.75);
            border-radius: 20px;

            box-shadow:
                0 10px 24px rgba(93, 70, 53, 0.17),
                0 2px 6px rgba(93, 70, 53, 0.08);

            transition:
                transform 250ms ease,
                box-shadow 250ms ease;
        }

        .section-intro {
            max-width: 330px;
            margin: 0 auto 23px;

            color: var(--texte-secondaire);
            text-align: center;

            font-size: 14px;
            font-style: italic;
            line-height: 1.55;
        }

        /* ----------------------------- */
        /* FORMULES                      */
        /* ----------------------------- */

        .grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .activity {
            position: relative;
        }

        .activity-input {
            position: absolute;

            width: 1px;
            height: 1px;

            opacity: 0;
            pointer-events: none;
        }

        .activity-card {
            position: relative;

            display: block;
            min-height: 150px;

            padding: 23px 45px 23px 24px;

            overflow: hidden;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.97),
                    rgba(255, 247, 239, 0.97)
                );

            border: 2px solid var(--dore-clair);
            border-radius: 21px;

            box-shadow:
                0 5px 14px rgba(93, 70, 53, 0.08);

            transition:
                transform 180ms ease,
                border-color 180ms ease,
                background-color 180ms ease,
                box-shadow 180ms ease;
        }

        .activity-card:active {
            transform: scale(0.985);
        }

        .activity-input:focus-visible + .activity-card {
            outline: 3px solid rgba(184, 148, 94, 0.38);
            outline-offset: 3px;
        }

        .activity-input:checked + .activity-card {
            background: var(--fond-formule-selectionnee);
            border-color: var(--dore);

            transform: translateY(-2px);

            box-shadow:
                0 9px 20px rgba(184, 148, 94, 0.17),
                0 0 0 3px rgba(184, 148, 94, 0.11);

            animation: selectionCarte 300ms ease-out;
        }

        /* Liseré doré de sélection */

        .activity-input:checked + .activity-card::before {
            content: "";

            position: absolute;
            inset: 0 auto 0 0;

            width: 5px;

            background: var(--dore);
            transform-origin: center;

            animation: apparitionLisere 280ms ease-out;
        }

        /* Cœur de sélection */

        .activity-input:checked + .activity-card::after {
            content: "♥";

            position: absolute;
            top: 13px;
            right: 13px;

            width: 30px;
            height: 30px;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            background: var(--dore);

            border-radius: 50%;

            box-shadow:
                0 4px 10px rgba(184, 148, 94, 0.28);

            font-family: Georgia, serif;
            font-size: 14px;

            animation: apparitionCoeur 280ms ease-out;
        }

        .formule-titre {
            display: block;

            margin-bottom: 10px;

            color: var(--texte-principal);
            text-align: center;

            font-family:
                "Palatino Linotype",
                Palatino,
                "Book Antiqua",
                Georgia,
                serif;

            font-size: clamp(23px, 7vw, 29px);
            font-weight: normal;
            font-style: italic;
            line-height: 1.15;
        }

        .formule-separateur {
            display: block;

            width: 58px;
            height: 1px;

            margin: 0 auto 14px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--dore),
                    transparent
                );
        }

        .formule-description {
            display: block;

            color: var(--texte-secondaire);
            text-align: center;

            font-size: 14px;
            line-height: 1.65;
        }

        /* ----------------------------- */
        /* SUPPLÉMENTS                   */
        /* ----------------------------- */

        .supplements-title {
            margin: 36px 0 7px;

            color: var(--texte-principal);
            text-align: center;

            font-family:
                "Palatino Linotype",
                Palatino,
                Georgia,
                serif;

            font-size: 25px;
            font-weight: normal;
            font-style: italic;
        }

        .supplements-intro {
            margin-bottom: 18px;

            color: var(--texte-secondaire);
            text-align: center;

            font-size: 13px;
        }

        .supplement .activity-card {
            min-height: auto;
            padding: 19px 43px 19px 20px;
        }

        .supplement .formule-titre {
            font-size: 21px;
        }

        .supplement .formule-description {
            font-size: 13px;
        }

        /* ----------------------------- */
        /* BOUTON                        */
        /* ----------------------------- */

        .validate-button {
            width: 100%;
            min-height: 54px;

            margin-top: 29px;
            padding: 15px 18px;

            color: white;
            background: var(--vert);

            border: none;
            border-radius: 15px;

            box-shadow:
                0 7px 16px rgba(104, 134, 90, 0.22);

            font-family: Georgia, "Times New Roman", serif;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 0.3px;

            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;

            transition:
                transform 180ms ease,
                background-color 180ms ease,
                box-shadow 180ms ease;
        }

        .validate-button:active {
            background: var(--vert-fonce);
            transform: scale(0.985);
        }

        .validate-button:focus-visible {
            outline: 3px solid rgba(123, 154, 107, 0.38);
            outline-offset: 3px;
        }

        /* ----------------------------- */
        /* MESSAGE D’ERREUR              */
        /* ----------------------------- */

        .error-message {
            display: none;

            margin: 16px 0 0;
            padding: 12px 14px;

            color: #74482e;
            background: #fff8ee;

            border: 1px solid #d6b58e;
            border-radius: 12px;

            text-align: center;
            font-size: 14px;
            line-height: 1.4;
        }

        .error-message.visible {
            display: block;
            animation: apparitionMessage 220ms ease-out;
        }

        /* ----------------------------- */
        /* OVERLAY                       */
        /* ----------------------------- */

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            color: white;
            background: rgba(93, 70, 53, 0.96);

            text-align: center;

            font-family:
                "Palatino Linotype",
                Palatino,
                Georgia,
                serif;

            font-size: 24px;
            font-style: italic;
            line-height: 1.5;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition:
                opacity 350ms ease,
                visibility 350ms ease;
        }

        #overlay.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* ----------------------------- */
        /* ANIMATIONS                    */
        /* ----------------------------- */

        @keyframes apparitionPage {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes selectionCarte {
            0% {
                transform: translateY(0) scale(1);
            }

            55% {
                transform: translateY(-2px) scale(1.012);
            }

            100% {
                transform: translateY(-2px) scale(1);
            }
        }

        @keyframes apparitionCoeur {
            0% {
                opacity: 0;
                transform: scale(0.45);
            }

            70% {
                transform: scale(1.12);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes apparitionLisere {
            from {
                transform: scaleY(0);
            }

            to {
                transform: scaleY(1);
            }
        }

        @keyframes apparitionMessage {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Effets réservés aux appareils avec souris */

        @media (hover: hover) and (pointer: fine) {
            .hero-photo:hover {
                transform: translateY(-2px) scale(1.015);

                box-shadow:
                    0 14px 28px rgba(93, 70, 53, 0.2),
                    0 3px 8px rgba(93, 70, 53, 0.09);
            }

            .activity-card:hover {
                transform: translateY(-3px);
                border-color: #d1b282;

                box-shadow:
                    0 10px 24px rgba(93, 70, 53, 0.12);
            }

            .activity-input:checked + .activity-card:hover {
                transform: translateY(-3px);
            }

            .validate-button:hover {
                background: var(--vert-fonce);
                transform: translateY(-2px);

                box-shadow:
                    0 10px 20px rgba(104, 134, 90, 0.27);
            }
        }

        /* ----------------------------- */
        /* PETITS SMARTPHONES            */
        /* ----------------------------- */

        @media (max-width: 420px) {
            body {
                padding-right: 12px;
                padding-left: 12px;
            }

            .container {
                padding: 23px 16px;
                border-radius: 22px;
            }

            .date-box {
                margin-bottom: 24px;
            }

            .hero-photo {
                width: min(82%, 245px);
                height: 155px;

                border-radius: 18px;
            }

            .photo-wrapper {
                margin-bottom: 19px;
            }

            .activity-card {
                min-height: 145px;

                padding:
                    21px
                    42px
                    21px
                    18px;
            }

            .formule-description {
                line-height: 1.55;
            }
        }

        /* Désactivation des animations si demandée */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h2 class="date-title">
            Choisissez une date ❤️
        </h2>

        <div class="date-box">
            <input
                type="date"
                id="date"
                aria-label="Date du rendez-vous"
            >
        </div>

        <h1 class="section-title">
            Plan de la soirée
        </h1>

        <div class="photo-wrapper">
            <img
                src="./images/Image14.jpg"
                class="hero-photo"
                alt="Souvenir en voilier"
            >
        </div>

        <p class="section-intro">
            Choisissez la formule qui vous ressemble,
            puis laissez la soirée suivre son cours.
        </p>

        <!-- FORMULES -->

        <section
            class="grid"
            aria-label="Choix de la formule"
        >
            <div class="activity">
                <input
                    class="activity-input"
                    type="radio"
                    name="activity"
                    id="simplicite"
                    value="La simplicité"
                >

                <label
                    class="activity-card"
                    for="simplicite"
                >
                    <span class="formule-titre">
                        La simplicité
                    </span>

                    <span class="formule-separateur"></span>

                    <span class="formule-description">
                        Un verre en ville pour commencer la soirée,
                        suivi d’un dîner au restaurant dans une adresse
                        choisie avec soin.
                    </span>
                </label>
            </div>

            <div class="activity">
                <input
                    class="activity-input"
                    type="radio"
                    name="activity"
                    id="art6"
                    value="Le 6ème Art"
                >

                <label
                    class="activity-card"
                    for="art6"
                >
                    <span class="formule-titre">
                        Le 6ème Art
                    </span>

                    <span class="formule-separateur"></span>

                    <span class="formule-description">
                        Un dîner dans une belle adresse,
                        puis une séance de cinéma pour prolonger
                        la magie de la soirée.
                    </span>
                </label>
            </div>

            <div class="activity">
                <input
                    class="activity-input"
                    type="radio"
                    name="activity"
                    id="domicile"
                    value="Dîner à domicile"
                >

                <label
                    class="activity-card"
                    for="domicile"
                >
                    <span class="formule-titre">
                        Dîner à domicile
                    </span>

                    <span class="formule-separateur"></span>

                    <span class="formule-description">
                        Le chef étoilé Rauger vient à domicile
                        pour préparer un dîner à votre convenance,
                        ou inspiré de la pêche du matin.
                    </span>
                </label>
            </div>
        </section>

        <!-- SUPPLÉMENTS -->

        <h2 class="supplements-title">
            Les suppléments
        </h2>

        <p class="supplements-intro">
            Facultatifs et cumulables, selon vos envies.
        </p>

        <section
            class="grid"
            aria-label="Suppléments optionnels"
        >
            <div class="activity supplement">
                <input
                    class="activity-input"
                    type="checkbox"
                    name="supplement"
                    id="balade"
                    value="Balade accompagnée"
                >

                <label
                    class="activity-card"
                    for="balade"
                >
                    <span class="formule-titre">
                        Balade accompagnée
                    </span>

                    <span class="formule-separateur"></span>

                    <span class="formule-description">
                        Une balade dans la plus belle ville de France.
                        Main dans la main et baisers dans les ruelles
                        sombres inclus.
                    </span>
                </label>
            </div>

            <div class="activity supplement">
                <input
                    class="activity-input"
                    type="checkbox"
                    name="supplement"
                    id="chauffeur"
                    value="Chauffeur privé"
                >

                <label
                    class="activity-card"
                    for="chauffeur"
                >
                    <span class="formule-titre">
                        Chauffeur privé
                    </span>

                    <span class="formule-separateur"></span>

                    <span class="formule-description">
                        Un chauffeur peut venir vous chercher,
                        puis vous raccompagner chez vous.
                        Banquette arrière incluse.
                    </span>
                </label>
            </div>
        </section>

        <button
            class="validate-button"
            id="validate-button"
            type="button"
        >
            C’EST PARFAIT !
        </button>

        <p
            class="error-message"
            id="error-message"
            role="alert"
            aria-live="polite"
        ></p>
    </main>

    <div
        id="overlay"
        role="status"
        aria-live="polite"
    >
        Préparation du rendez-vous ❤️...
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        const dateInput =
            document.getElementById("date");

        const validateButton =
            document.getElementById("validate-button");

        const overlay =
            document.getElementById("overlay");

        const errorMessage =
            document.getElementById("error-message");

        /*
         * Empêche de choisir une date passée.
         */
        const today = new Date();

        const localToday = new Date(
            today.getTime() -
            today.getTimezoneOffset() * 60000
        )
            .toISOString()
            .split("T")[0];

        dateInput.min = localToday;

        /*
         * Retour haptique discret pendant la sélection.
         */
        document
            .querySelectorAll(".activity-input")
            .forEach(function (input) {
                input.addEventListener(
                    "change",
                    function () {
                        if (
                            "vibrate" in navigator &&
                            typeof navigator.vibrate === "function"
                        ) {
                            navigator.vibrate(18);
                        }

                        masquerErreur();
                    }
                );
            });

        dateInput.addEventListener(
            "change",
            masquerErreur
        );

        validateButton.addEventListener(
            "click",
            validerChoix
        );

        function afficherErreur(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add("visible");

            errorMessage.scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });
        }

        function masquerErreur() {
            errorMessage.textContent = "";
            errorMessage.classList.remove("visible");
        }

        function validerChoix() {
            const date = dateInput.value;

            const activite =
                document.querySelector(
                    'input[name="activity"]:checked'
                );

            const supplements =
                Array.from(
                    document.querySelectorAll(
                        'input[name="supplement"]:checked'
                    )
                ).map(function (input) {
                    return input.value;
                });

            masquerErreur();

            if (!date) {
                afficherErreur(
                    "Choisissez d’abord une date ❤️"
                );

                dateInput.focus();
                return;
            }

            if (!activite) {
                afficherErreur(
                    "Choisissez une formule pour la soirée ❤️"
                );

                return;
            }

            /*
             * Sauvegarde pour rendezvous.html.
             */
            localStorage.setItem(
                "date",
                date
            );

            localStorage.setItem(
                "activite",
                activite.value
            );

            localStorage.setItem(
                "supplements",
                JSON.stringify(supplements)
            );

            localStorage.setItem(
                "balade",
                String(
                    document
                        .getElementById("balade")
                        .checked
                )
            );

            localStorage.setItem(
                "chauffeur",
                String(
                    document
                        .getElementById("chauffeur")
                        .checked
                )
            );

            /*
             * La validation continue même si la bibliothèque
             * des confettis n’a pas été chargée.
             */
            if (typeof window.confetti === "function") {
                window.confetti({
                    particleCount: 150,
                    spread: 85,
                    startVelocity: 28,
                    gravity: 0.9,
                    scalar: 0.9,
                    origin: {
                        y: 0.62
                    }
                });
            }

            overlay.textContent =
                "Préparation du rendez-vous ❤️...";

            overlay.classList.add("show");

            window.setTimeout(
                function () {
                    overlay.textContent =
                        "Presque prêt ✨";
                },
                900
            );

            window.setTimeout(
                function () {
                    window.location.href =
                        "rendezvous.html";
                },
                1900
            );
        }
    </script>
</body>
</html>
