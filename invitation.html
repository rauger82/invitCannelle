<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#e8d6c3"
    >

    <title>L’invitation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <article class="container">
            <img src="images/Image15.jpg" class="top-img" alt="">
            <div class="ornament" aria-hidden="true">
                ♥
            </div>

            <h1 class="page-title">
                Chère Cannelle,
            </h1>

            <h2 class="question-title">
                Accepteriez-vous un nouveau rendez-vous avec Rémi&nbsp;? ❤️
            </h2>

            <section class="options" aria-label="Réponse à l’invitation">
                <div class="choice">
                    images/Image6.jpg

                    <span class="choice-label">
                        Le choix raisonnable
                    </span>

                    <button
                        type="button"
                        class="btn-yes"
                        id="yesButton"
                    >
                        OUI ❤️
                    </button>
                </div>

                <div class="choice">
                    images/Image10.jpg

                    <span class="choice-label">
                        Le choix presque impossible
                    </span>
                </div>
            </section>
        </article>
    </main>

    <button
        type="button"
        class="no-btn"
        id="noButton"
        aria-label="Refuser l’invitation"
    >
        Non, désolée
    </button>

    <script src="script.js"></script>
</body>
</html>
