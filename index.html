<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#e8d6c3"
    >

    <title>Invitation pour ma belle Cannelle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <article class="card">
            <img src="images/Image16.jpg" class="hero-photo" alt="">
            <p class="photo-caption">
                Une invitation rien que pour vous
            </p>

            <div class="ornament" aria-hidden="true">
                ♥
            </div>

            <h1 class="page-title">
                Invitation
            </h1>

            <div class="invitation-details">
                <p>
                    De la part de
                    <strong>ton Rauger, Rémi, mimichat, miguel, date du lundi, date du mardi, date du...</strong>
                </p>

                <p>
                    Pour
                    <strong>⭐ Cannelle ⭐</strong>
                </p>
            </div>

            <button
                type="button"
                class="primary-button transition-link"
                data-href="invitation.html"
            >
                <span>Ouvrir la lettre</span>
                <span aria-hidden="true">💌</span>
            </button>
        </article>
    </main>

    <script>
        document
            .querySelectorAll(".transition-link")
            .forEach(function (button) {
                button.addEventListener("click", function () {
                    const destination = button.dataset.href;
                    const page = document.querySelector(".page");

                    page.classList.add("page-exit");

                    window.setTimeout(function () {
                        window.location.href = destination;
                    }, 330);
                });
            });
    </script>
</body>
</html>
